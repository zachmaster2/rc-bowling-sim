<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RC Bowling Simulator</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{
  color-scheme: dark;
  --bg:#0b0c0f; --view-bg:#07080a; --panel:#14161b; --panel-2:#1b1e25; --line:#2a2e37;
  --ink:#e9e6df; --ink-dim:#9a9a96; --ink-faint:#6b6d70; --accent:#f2b544; --accent-ink:#1a1408;
  --stick-ring:rgba(233,230,223,.28); --stick-fill:rgba(233,230,223,.06); --knob:#e9e6df; --knob-ink:#14161b;
  --hud-bg:rgba(10,11,14,.55); --card:#171a20f2; --ok:#7fd18b; --warn:#f2b544; --bad:#ff7a6b; --strip:#20242c; --strip-tick:#4d5566;
  --marker:#f2b544; --course:#4fc3f7;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
html{height:100%;box-sizing:border-box;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:relative;height:100%;display:grid;grid-template-rows:minmax(0,3fr) minmax(150px,1fr);background:var(--bg)}
#view{position:relative;overflow:hidden;background:var(--view-bg);touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:6px var(--gut-r) 0 var(--gut-l);pointer-events:none;font-size:11px;line-height:1.3;font-variant-numeric:tabular-nums}
.hud .blk{background:var(--hud-bg);border-radius:8px;padding:3px 7px;white-space:nowrap;pointer-events:auto}
.hud .blk b{font-weight:600;color:var(--ink)} .hud .blk span{color:var(--ink-dim)}
.hud .right{display:flex;gap:6px;align-items:flex-start;text-align:right}
.iconbtn{pointer-events:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--hud-bg);display:grid;place-items:center;padding:0;cursor:pointer}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:1.7}
#marker{position:absolute;left:50%;bottom:4px;width:30px;height:36px;margin-left:58px;pointer-events:none;transform-origin:50% 85%}
#marker svg{width:100%;height:100%}
#course{position:absolute;left:50%;bottom:4px;width:30px;height:36px;margin-left:58px;pointer-events:none;transform-origin:50% 85%}
#course svg{width:100%;height:100%}
/* the controller (13 Nov): its stick and keys in the view's corner; with it connected the touch panel can go and the HUD is sized for a TV across the room */
#padHud{position:absolute;left:var(--gut-l);bottom:16px;display:flex;align-items:center;gap:12px;pointer-events:none;z-index:1}
#padRing{position:relative;width:84px;height:84px;border-radius:50%;border:2px solid var(--stick-ring);background:rgba(10,11,14,.45)}
#padRing.live{border-color:var(--accent)}
#padDot{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--knob);box-shadow:0 2px 6px rgba(0,0,0,.5)}
#padKeys{display:flex;flex-direction:column;gap:6px}
#padKeys span{font-size:13px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:8px;border:1.5px solid var(--line);color:var(--ink-dim);background:rgba(10,11,14,.45)}
#pkStop.on{background:var(--bad);border-color:var(--bad);color:#1a0b08}
#app.nopanel{grid-template-rows:minmax(0,1fr)}
#app.tv .hud{font-size:clamp(12px,1.05vw,22px);padding:.7em calc(var(--gut-r) + .3em) 0 calc(var(--gut-l) + .3em)}
#app.tv .hud .blk{border-radius:.6em;padding:.3em .7em}
#app.tv .iconbtn{width:2.6em;height:2.6em;border-radius:.5em} #app.tv .iconbtn svg{width:58%;height:58%}
#app.tv #card{max-width:min(620px,46vw);top:9%;font-size:clamp(13px,1.1vw,22px);padding:.9em 1.1em;border-radius:18px}
#app.tv #card h2{font-size:1.45em} #app.tv #card .chart{font-size:.95em} #app.tv #card .chart span{font-size:.8em !important}
#app.tv #card .pill{height:2.3em;padding:0 1em;border-radius:1.15em;font-size:.95em}
#app.tv #marker{width:44px;height:53px;margin-left:96px;bottom:14px} #app.tv #course{width:44px;height:53px;margin-left:96px;bottom:14px}
#app.tv #padRing{width:clamp(84px,6.5vw,132px);height:clamp(84px,6.5vw,132px)}
#app.tv #padDot{width:clamp(24px,1.9vw,38px);height:clamp(24px,1.9vw,38px);margin:calc(clamp(24px,1.9vw,38px) / -2) 0 0 calc(clamp(24px,1.9vw,38px) / -2)}
#app.tv #padKeys span{font-size:clamp(13px,.95vw,20px)}
.padhint{align-self:center;margin-right:auto;color:var(--ink-dim);font-size:.85em}
.set small.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;word-break:break-all;margin-top:2px}
.pill{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:var(--card);font-size:12px;cursor:pointer}
.pill.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
/* result card */
#card{position:absolute;left:var(--gut-l);right:var(--gut-r);top:58px;margin:0 auto;max-width:340px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#card h2{margin:0 0 6px;font-size:17px;font-weight:650;letter-spacing:.01em}
#card .row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:4px 0}
#card .row span:first-child{color:var(--ink-dim)}
#card .chart{margin-top:6px;padding:7px 9px;border-radius:9px;background:var(--panel-2);color:var(--ink);font-size:12.5px}
#card .chart b{color:var(--accent)}
#card .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:9px}
/* controller panel */
#panel{position:relative;background:var(--panel);border-top:1px solid var(--line);touch-action:none;display:flex;flex-direction:column;overflow:hidden}
#strip{position:relative;flex:0 0 30px;margin:6px var(--gut-r) 0 var(--gut-l);border-radius:8px;background:var(--strip);overflow:hidden;touch-action:none;cursor:ew-resize}
#stripTicks{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#stripLbl{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;color:var(--ink-dim);pointer-events:none;letter-spacing:.04em}
#prow{position:relative;flex:1 1 auto;display:flex;min-height:0}
#zone{position:relative;flex:1 1 auto;touch-action:none;cursor:crosshair;margin-left:env(safe-area-inset-left,0px)}
#zoneHint{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-faint);font-size:12px;pointer-events:none;text-align:center;padding:0 10px}
#ring{position:fixed;left:0;top:0;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid var(--stick-ring);background:var(--stick-fill);
  pointer-events:none;opacity:0;transition:opacity .25s}
#ring.on{opacity:1;transition:opacity .05s}
#ring.held{opacity:1;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,255,255,.06)} #ring.held #knob{background:var(--accent)}   /* the trigger holds the stick: it stays drawn where it was taken */
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--knob);box-shadow:0 2px 8px rgba(0,0,0,.5)}
#knob.home{transition:transform .14s ease-out}
#bcol{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:0 4px}
#resetBtn{width:130px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;padding:0}
#resetBtn:active{background:var(--ink);color:var(--panel)}
#prompt{width:130px;padding:3px 2px;border:1px solid var(--warn);border-radius:9px;background:transparent;text-align:center;font-size:10.5px;line-height:1.25;color:var(--warn);cursor:pointer}
/* settings sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:10px var(--gut-r) calc(14px + env(safe-area-inset-bottom,0px)) var(--gut-l);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  box-shadow:0 -12px 40px rgba(0,0,0,.6);font-size:13.5px;z-index:5}
@media (min-width:760px){#sheet{left:50%;right:auto;width:720px;transform:translateX(-50%)}}    /* a laptop or a TV: the sheet as a column, not the screen's width */
#app.tv #sheet{font-size:15px}
#sheet h3{margin:2px 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.set label{color:var(--ink)} .set small{display:block;color:var(--ink-dim);font-size:11px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-dim)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.num{display:flex;align-items:center;gap:6px}
.num button{width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
.num output{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.tag{font-size:10px;padding:1px 5px;border-radius:5px;background:var(--warn);color:var(--accent-ink);margin-left:4px;font-weight:600}
#logTxt{width:100%;height:110px;margin-top:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:11px ui-monospace,Menlo,monospace;
  -webkit-user-select:text;user-select:text}
#sheetMsg{color:var(--ok);font-size:12px;min-height:16px}
/* the two sticks: the Main stick's zone on the left, the Precision stick's on the right, the Lock toggle button and Reset between them */
#zone2{position:relative;flex:1 1 auto;touch-action:none;cursor:ew-resize;margin-right:env(safe-area-inset-right,0px)}
#zone2Hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-faint);font-size:12px;pointer-events:none;text-align:center;padding:0 10px}
#lockBtn{width:130px;height:36px;border-radius:12px;border:1.5px solid var(--accent);background:var(--panel-2);color:var(--accent);font-size:14px;font-weight:700;letter-spacing:.08em;cursor:pointer;padding:0}
#lockBtn.on{background:var(--accent);color:var(--accent-ink)}
/* the precision stick: a regular stick the size of the main one (his word, 17 Nov), drawn blue */
#ring2{position:fixed;left:0;top:0;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid var(--course);background:var(--stick-fill);
  pointer-events:none;opacity:0;transition:opacity .25s}
#ring2.on{opacity:1;transition:opacity .05s}
#knob2{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--course);box-shadow:0 2px 8px rgba(0,0,0,.5)}
#knob2.home{transition:transform .14s ease-out}
#padRing2{position:relative;width:120px;height:40px;border-radius:20px;border:2px solid var(--stick-ring);background:rgba(10,11,14,.45)}
#padRing2.live{border-color:var(--course)}
#padDot2{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--course)}
#pkLock.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#pkTrig.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#app.tv #padRing2{width:clamp(120px,9vw,190px);height:clamp(40px,3vw,64px);border-radius:999px}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="cv" aria-label="Lane view from the driver's eye"></canvas>
    <div class="hud" id="hud">
      <div class="blk" id="hudL"><b id="hSpd">0.00 m/s</b> <span id="hMph">0.0 mph</span><br><span id="hDistLbl">to head pin</span> <b id="hDist">23.86 m</b></div>
      <div class="right">
        <div class="blk" id="hudR"><span id="hAim"><span id="hAimLbl">aim</span> <b id="hPsi">+0.0°</b><br></span><b id="hBall">Ball 1</b> <span id="hSrc">· Strip</span></div>
        <button class="iconbtn" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg></button>
      </div>
    </div>
    <div id="marker"><svg viewBox="0 0 34 40"><path d="M17 2 L28 20 L20.5 20 L20.5 37 L13.5 37 L13.5 20 L6 20 Z" fill="var(--marker)" fill-opacity=".85" stroke="#000" stroke-opacity=".45" stroke-width="1"/></svg></div>
    <div id="course"><svg viewBox="0 0 34 40"><path d="M17 1 L24 15 L19.2 15 L19.2 38 L14.8 38 L14.8 15 L10 15 Z" fill="var(--course)" fill-opacity=".95" stroke="#000" stroke-opacity=".5" stroke-width="1"/></svg></div>
    <div id="padHud" hidden><div id="padRing"><div id="padDot"></div></div><div id="padRing2" hidden><div id="padDot2"></div></div><div id="padKeys"><span id="pkStop">STOP</span><span id="pkLock">LOCK</span><span id="pkTrig">HOLD</span></div></div>
    <div id="card" hidden></div>
  </div>
  <div id="panel">
    <div id="strip" hidden><canvas id="stripTicks"></canvas><div id="stripLbl">◀ drag to turn the controller ▶</div></div>
    <div id="prow">
      <div id="zone"><div id="zoneHint">Main stick: push to drive</div></div>
      <div id="bcol"><button id="lockBtn" class="on" aria-label="Lock toggle button">LOCK</button><button id="resetBtn" aria-label="Reset this ball">Reset</button><button id="prompt" hidden>Tap to enable motion</button></div>
      <div id="zone2"><div id="zone2Hint">Precision stick: small aims ◀ ▶<br>thumb down = Hold trigger</div></div>
    </div>
  </div>
  <div id="ring"><div id="knob"></div></div>
  <div id="ring2"><div id="knob2"></div></div>
  <div id="sheet" hidden>
    <h3>Settings <button class="pill" id="sheetClose">Done</button></h3>
    <div class="set"><label>Floor<small>the bowling lane, or an open floor to drive around on</small></label><div class="seg" data-k="place"><button data-v="lane">Lane</button><button data-v="free">Free play</button></div></div>
    <div class="set" id="ctrlRow"><label>Controls<small>New: the stick’s “up” is away from you, set as each push starts. Old: “up” is where the controller points</small></label><div class="seg" data-k="ctrl"><button data-v="away">New</button><button data-v="point">Old</button></div></div>
    <div class="set"><label>Precision stick range<small>how far full left or right moves the aim (back to nothing when you let go)</small></label><div class="num" data-k="fineRange" data-min="1" data-max="15" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set"><label>Sensing<small>the ball's knowledge of the controller</small></label><div class="seg" data-k="sensing"><button data-v="ideal">Ideal</button><button data-v="designed">As designed</button></div></div>
    <div class="set laneOnly"><label>Start board<small>1-39, counted from the right; 20 = centre</small></label><div class="num" data-k="board" data-min="1" data-max="39" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set laneOnly"><label>Ball start<small>metres before the foul line</small></label><div class="num" data-k="ballStart" data-min="1.5" data-max="3.6" data-step="0.1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set laneOnly"><label>Walk up with the ball<small>you follow it to the foul line; “+ zoom” also closes the view in on the ball and pins</small></label><div class="seg" data-k="walk"><button data-v="zoom">+ zoom</button><button data-v="walk">Walk only</button></div></div>
    <div class="set" id="markerRow"><label><span id="markerLbl">Pointing marker</span><small id="markerNote">where the controller points while the Lock toggle button is off: the amber arrow</small></label><div class="seg" data-k="marker"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div class="set" id="courseRow"><label>Course arrow<small>where the ball is being sent: the blue arrow</small></label><div class="seg" data-k="course"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div class="set" id="padRow"><label>Controller<small id="padNote">none connected</small><small id="padLive" class="mono"></small></label><button class="pill" id="padSetupBtn">Setup…</button></div>
    <div class="set padSet"><label>Touch panel<small>while a controller is connected</small></label><div class="seg" data-k="padPanel"><button data-v="hide">Hide</button><button data-v="show">Show</button></div></div>
    <div class="set padAdv"><label>Main stick left–right</label><div class="num" data-k="padX" data-min="0" data-max="9" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>Main stick forward–back</label><div class="num" data-k="padY" data-min="0" data-max="9" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>Flip the Main stick<small>L–R flips the Precision stick too</small></label><div class="seg" data-k="padFlip"><button data-v="none">No</button><button data-v="x">L–R</button><button data-v="y">F–B</button><button data-v="both">Both</button></div></div>
    <div class="set padAdv"><label>Turn<small>the controller's own turn: the heading ÷ 180°, + = turned right; none = it has no gyro</small></label><div class="num" data-k="padTurnAx" data-min="-1" data-max="9" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>Stop button<small>brakes while held; on the result card, the next ball</small></label><div class="num" data-k="padStop" data-min="-1" data-max="15" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>Hold trigger<small>held, it holds the Main stick as it is</small></label><div class="num" data-k="padTrig" data-min="-1" data-max="15" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>Lock toggle button<small id="padLockNote">on: only the sticks steer; off: turning the controller aims too</small></label><div class="num" data-k="padLock" data-min="-1" data-max="15" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>Precision stick left–right<small>auto: the right stick (a standard gamepad's, or the RC Bowling controller's axis 4)</small></label><div class="num" data-k="padFineX" data-min="-1" data-max="9" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>Reset<small>the ball back at its start, pointing straight</small></label><div class="num" data-k="padReset" data-min="-1" data-max="15" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>Next ball<small>on the result card</small></label><div class="num" data-k="padNext" data-min="-1" data-max="15" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set"><label>Shot log<small id="logCount">0 balls kept</small></label><div style="display:flex;gap:6px"><button class="pill" id="copyLog">Copy shot log</button><button class="pill" id="clearLog">Clear…</button></div></div>
    <div class="set" id="clearAsk" hidden><label>Clear all kept balls?</label><div style="display:flex;gap:6px"><button class="pill" id="clearNo">Keep</button><button class="pill primary" id="clearYes">Clear</button></div></div>
    <div id="sheetMsg"></div>
    <textarea id="logTxt" readonly hidden></textarea>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(function () {
"use strict";
const IN = 0.0254, FT = 0.3048;
const DIM = {
  laneLen: 60 * FT,
  laneW: 41.5 * IN,
  approach: 4.57,
  gutterW: 9.25 * IN, gutterD: 1.875 * IN,
