<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RC Bowling Simulator</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{
  color-scheme: dark;
  --bg:#0b0c0f; --view-bg:#07080a; --panel:#14161b; --panel-2:#1b1e25; --line:#2a2e37;
  --ink:#e9e6df; --ink-dim:#9a9a96; --ink-faint:#6b6d70; --accent:#f2b544; --accent-ink:#1a1408;
  --stick-ring:rgba(233,230,223,.28); --stick-fill:rgba(233,230,223,.06); --knob:#e9e6df; --knob-ink:#14161b;
  --hud-bg:rgba(10,11,14,.55); --card:#171a20f2; --ok:#7fd18b; --warn:#f2b544; --bad:#ff7a6b; --strip:#20242c; --strip-tick:#4d5566;
  --marker:#f2b544;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
html{height:100%;box-sizing:border-box;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:relative;height:100%;display:grid;grid-template-rows:minmax(0,3fr) minmax(150px,1fr);background:var(--bg)}
#view{position:relative;overflow:hidden;background:var(--view-bg);touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:6px var(--gut-r) 0 var(--gut-l);pointer-events:none;font-size:11px;line-height:1.3;font-variant-numeric:tabular-nums}
.hud .blk{background:var(--hud-bg);border-radius:8px;padding:3px 7px;white-space:nowrap;pointer-events:auto}
.hud .blk b{font-weight:600;color:var(--ink)} .hud .blk span{color:var(--ink-dim)}
.hud .right{display:flex;gap:6px;align-items:flex-start;text-align:right}
.iconbtn{pointer-events:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--hud-bg);display:grid;place-items:center;padding:0;cursor:pointer}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:1.7}
#marker{position:absolute;left:50%;bottom:4px;width:30px;height:36px;margin-left:58px;pointer-events:none;transform-origin:50% 85%}
#marker svg{width:100%;height:100%}
/* the HOLD button (an option, 12 Nov): in the lane view just above the panel, for the other thumb - outside the stick's zone, clear of Reset */
#holdBtn{position:absolute;bottom:20px;width:68px;height:68px;border-radius:16px;border:1.5px solid var(--accent);background:rgba(20,22,27,.62);color:var(--accent);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;cursor:pointer;touch-action:none;z-index:2}
#holdBtn.left{left:var(--gut-l)} #holdBtn.right{right:var(--gut-r)}
#holdBtn b{font-size:14px;font-weight:700;letter-spacing:.06em} #holdBtn span{font-size:9.5px;color:var(--ink-dim);pointer-events:none}
#holdBtn.on{background:var(--accent);color:var(--accent-ink)} #holdBtn.on span{color:var(--accent-ink)}
/* the handset (13 Nov): its stick and keys in the view's corner; with it connected the touch panel can go and the HUD is sized for a TV across the room */
#padHud{position:absolute;left:var(--gut-l);bottom:16px;display:flex;align-items:center;gap:12px;pointer-events:none;z-index:1}
#padRing{position:relative;width:84px;height:84px;border-radius:50%;border:2px solid var(--stick-ring);background:rgba(10,11,14,.45)}
#padRing.live{border-color:var(--accent)}
#padDot{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--knob);box-shadow:0 2px 6px rgba(0,0,0,.5)}
#padKeys{display:flex;flex-direction:column;gap:6px}
#padKeys span{font-size:13px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:8px;border:1.5px solid var(--line);color:var(--ink-dim);background:rgba(10,11,14,.45)}
#pkStop.on{background:var(--bad);border-color:var(--bad);color:#1a0b08} #pkHold.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} #pkHold.off{opacity:.35}
#app.nopanel{grid-template-rows:minmax(0,1fr)}
#app.tv .hud{font-size:clamp(12px,1.05vw,22px);padding:.7em calc(var(--gut-r) + .3em) 0 calc(var(--gut-l) + .3em)}
#app.tv .hud .blk{border-radius:.6em;padding:.3em .7em}
#app.tv .iconbtn{width:2.6em;height:2.6em;border-radius:.5em} #app.tv .iconbtn svg{width:58%;height:58%}
#app.tv #card{max-width:min(620px,46vw);top:9%;font-size:clamp(13px,1.1vw,22px);padding:.9em 1.1em;border-radius:18px}
#app.tv #card h2{font-size:1.45em} #app.tv #card .chart{font-size:.95em} #app.tv #card .chart span{font-size:.8em !important}
#app.tv #card .pill{height:2.3em;padding:0 1em;border-radius:1.15em;font-size:.95em}
#app.tv #marker{width:44px;height:53px;margin-left:96px;bottom:14px}
#app.tv #padRing{width:clamp(84px,6.5vw,132px);height:clamp(84px,6.5vw,132px)}
#app.tv #padDot{width:clamp(24px,1.9vw,38px);height:clamp(24px,1.9vw,38px);margin:calc(clamp(24px,1.9vw,38px) / -2) 0 0 calc(clamp(24px,1.9vw,38px) / -2)}
#app.tv #padKeys span{font-size:clamp(13px,.95vw,20px)}
.padhint{align-self:center;margin-right:auto;color:var(--ink-dim);font-size:.85em}
.set small.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;word-break:break-all;margin-top:2px}
.pill{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:var(--card);font-size:12px;cursor:pointer}
.pill.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
/* result card */
#card{position:absolute;left:var(--gut-l);right:var(--gut-r);top:58px;margin:0 auto;max-width:340px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#card h2{margin:0 0 6px;font-size:17px;font-weight:650;letter-spacing:.01em}
#card .row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:4px 0}
#card .row span:first-child{color:var(--ink-dim)}
#card .chart{margin-top:6px;padding:7px 9px;border-radius:9px;background:var(--panel-2);color:var(--ink);font-size:12.5px}
#card .chart b{color:var(--accent)}
#card .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:9px}
/* controller panel */
#panel{position:relative;background:var(--panel);border-top:1px solid var(--line);touch-action:none;display:flex;flex-direction:column;overflow:hidden}
#strip{position:relative;flex:0 0 30px;margin:6px var(--gut-r) 0 var(--gut-l);border-radius:8px;background:var(--strip);overflow:hidden;touch-action:none;cursor:ew-resize}
#stripTicks{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#stripLbl{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;color:var(--ink-dim);pointer-events:none;letter-spacing:.04em}
#prow{position:relative;flex:1 1 auto;display:flex;min-height:0}
#zone{position:relative;flex:1 1 auto;touch-action:none;cursor:crosshair;margin-left:env(safe-area-inset-left,0px)}
#zoneHint{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-faint);font-size:12px;pointer-events:none;text-align:center;padding:0 10px}
#ring{position:fixed;left:0;top:0;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid var(--stick-ring);background:var(--stick-fill);
  pointer-events:none;opacity:0;transition:opacity .25s}
#ring.on{opacity:1;transition:opacity .05s}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--knob);box-shadow:0 2px 8px rgba(0,0,0,.5)}
#knob.home{transition:transform .14s ease-out}
#bcol{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:0 var(--gut-r) 0 6px}
#bcol .btns{display:flex;gap:6px}
#recenter,#resetBtn{width:62px;height:62px;border-radius:14px;border:1px solid var(--accent);background:var(--panel-2);color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:0}
#resetBtn{border-color:var(--line);color:var(--ink)}
#resetBtn:active{background:var(--ink);color:var(--panel)}
#recenter:active{background:var(--accent);color:var(--accent-ink)}
#src{font-size:10.5px;color:var(--ink-dim)}
#prompt{max-width:84px;text-align:center;font-size:10px;line-height:1.25;color:var(--warn);pointer-events:none}
/* settings sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:10px var(--gut-r) calc(14px + env(safe-area-inset-bottom,0px)) var(--gut-l);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  box-shadow:0 -12px 40px rgba(0,0,0,.6);font-size:13.5px;z-index:5}
@media (min-width:760px){#sheet{left:50%;right:auto;width:720px;transform:translateX(-50%)}}    /* a laptop or a TV: the sheet as a column, not the screen's width */
#app.tv #sheet{font-size:15px}
#sheet h3{margin:2px 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.set label{color:var(--ink)} .set small{display:block;color:var(--ink-dim);font-size:11px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-dim)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.num{display:flex;align-items:center;gap:6px}
.num button{width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
.num output{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.tag{font-size:10px;padding:1px 5px;border-radius:5px;background:var(--warn);color:var(--accent-ink);margin-left:4px;font-weight:600}
#logTxt{width:100%;height:110px;margin-top:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:11px ui-monospace,Menlo,monospace;
  -webkit-user-select:text;user-select:text}
#sheetMsg{color:var(--ok);font-size:12px;min-height:16px}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="cv" aria-label="Lane view from the driver's eye"></canvas>
    <div class="hud" id="hud">
      <div class="blk" id="hudL"><b id="hSpd">0.00 m/s</b> <span id="hMph">0.0 mph</span><br><span>to head pin</span> <b id="hDist">23.86 m</b></div>
      <div class="right">
        <div class="blk" id="hudR"><span id="hAim"><span>aim</span> <b id="hPsi">+0.0°</b><br></span><b id="hBall">Ball 1</b> <span id="hSrc">· Strip</span></div>
        <button class="iconbtn" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg></button>
      </div>
    </div>
    <div id="marker"><svg viewBox="0 0 34 40"><path d="M17 2 L28 20 L20.5 20 L20.5 37 L13.5 37 L13.5 20 L6 20 Z" fill="var(--marker)" fill-opacity=".85" stroke="#000" stroke-opacity=".45" stroke-width="1"/></svg></div>
    <button id="holdBtn" class="right" hidden aria-label="Hold"><b>HOLD</b><span id="holdSub">lock aim</span></button>
    <div id="padHud" hidden><div id="padRing"><div id="padDot"></div></div><div id="padKeys"><span id="pkStop">STOP</span><span id="pkHold">HOLD</span></div></div>
    <div id="card" hidden></div>
  </div>
  <div id="panel">
    <div id="strip" hidden><canvas id="stripTicks"></canvas><div id="stripLbl">◀ drag to turn the controller ▶</div></div>
    <div id="prow">
      <div id="zone"><div id="zoneHint">Put your thumb anywhere here — push to drive</div></div>
      <div id="bcol"><div class="btns"><button id="recenter">Recenter</button><button id="resetBtn" aria-label="Reset this ball">Reset</button></div><div id="src">Strip</div><div id="prompt" hidden>Tap Recenter to enable motion</div></div>
    </div>
  </div>
  <div id="ring"><div id="knob"></div></div>
  <div id="sheet" hidden>
    <h3>Settings <button class="pill" id="sheetClose">Done</button></h3>
    <div class="set"><label>Scheme<small id="schemeNote">Point the phone, push the stick</small></label><div class="seg" data-k="scheme"><button data-v="A">A Point+push</button><button data-v="B">B Hold line</button></div></div>
    <div class="set" id="curveRow"><label>Stick curve<small>flat near straight ahead (±30°)</small></label><div class="seg" data-k="curve"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div class="set" id="slopeRow"><label>Lean slope<small>° of course per ° of lean, from 10° to 45° of lean</small></label><div class="num" data-k="slope" data-min="0.10" data-max="0.30" data-step="0.05"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set" id="keepsRow"><label>Line keeps a lean<small>a lean held this long is kept whole; never = mapping B</small></label><div class="num" data-k="keeps" data-vals="0,2,3,4,5,6,7,8"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set"><label>Sensing<small>the ball's knowledge of the controller</small></label><div class="seg" data-k="sensing"><button data-v="ideal">Ideal</button><button data-v="designed">As designed</button></div></div>
    <div class="set"><label>Turn the controller with the phone<small>off: the stick alone drives</small></label><div class="seg" data-k="phoneTurn"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div class="set"><label>Start board<small>1-39, counted from the right; 20 = centre</small></label><div class="num" data-k="board" data-min="1" data-max="39" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set"><label>Ball start<small>metres before the foul line</small></label><div class="num" data-k="ballStart" data-min="1.5" data-max="3.6" data-step="0.1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set"><label>Walk up with the ball<small>you follow it up the approach, stop at the line</small></label><div class="seg" data-k="walk"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div class="set" id="holdRow"><label>Hold button<small id="holdNote">works only with “Turn the controller with the phone” on</small></label><div class="seg" data-k="hold"><button data-v="off">Off</button><button data-v="left">Left</button><button data-v="right">Right</button></div></div>
    <div class="set" id="markerRow"><label>Pointing marker</label><div class="seg" data-k="marker"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div class="set" id="padRow"><label>Handset<small id="padNote">none connected</small><small id="padLive" class="mono"></small></label><button class="pill" id="padSetupBtn">Setup…</button></div>
    <div class="set padSet"><label>Turn the controller with the handset<small>its gyro turns it; the phone's turn is not used</small></label><div class="seg" data-k="padTurn"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div class="set padSet"><label>Touch panel<small>while a handset is connected</small></label><div class="seg" data-k="padPanel"><button data-v="hide">Hide</button><button data-v="show">Show</button></div></div>
    <div class="set padAdv"><label>Stick left–right</label><div class="num" data-k="padX" data-min="0" data-max="9" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>Stick forward–back</label><div class="num" data-k="padY" data-min="0" data-max="9" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>Flip the stick</label><div class="seg" data-k="padFlip"><button data-v="none">No</button><button data-v="x">L–R</button><button data-v="y">F–B</button><button data-v="both">Both</button></div></div>
    <div class="set padAdv"><label>Turn<small>the heading ÷ 180°, + = turned right</small></label><div class="num" data-k="padTurnAx" data-min="-1" data-max="9" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>STOP<small>brakes while held; on the result card, the next ball</small></label><div class="num" data-k="padStop" data-min="-1" data-max="15" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>HOLD</label><div class="num" data-k="padHold" data-min="-1" data-max="15" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>Recenter</label><div class="num" data-k="padRecenter" data-min="-1" data-max="15" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>Reset</label><div class="num" data-k="padReset" data-min="-1" data-max="15" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set padAdv"><label>Next ball<small>on the result card</small></label><div class="num" data-k="padNext" data-min="-1" data-max="15" data-step="1"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div></div>
    <div class="set"><label>Shot log<small id="logCount">0 balls kept</small></label><div style="display:flex;gap:6px"><button class="pill" id="copyLog">Copy shot log</button><button class="pill" id="clearLog">Clear…</button></div></div>
    <div class="set"><label>Pins<small>start the frame again with a full rack</small></label><button class="pill" id="newFrameBtn">New frame (re-rack all pins)</button></div>
    <div class="set" id="clearAsk" hidden><label>Clear all kept balls?</label><div style="display:flex;gap:6px"><button class="pill" id="clearNo">Keep</button><button class="pill primary" id="clearYes">Clear</button></div></div>
    <div id="sheetMsg"></div>
    <textarea id="logTxt" readonly hidden></textarea>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(function () {
"use strict";
const IN = 0.0254, FT = 0.3048;
const DIM = {
  laneLen: 60 * FT,
  laneW: 41.5 * IN,
  approach: 4.57,
  gutterW: 9.25 * IN, gutterD: 1.875 * IN,
  deckPast: 34.1875 * IN,
  pinH: 15.0 * IN, pinBelly: 4.766 * IN, pinBellyH: 4.5 * IN, pinBase: 2.031 * IN,
  pinMass: (3 + 8 / 16) * 0.45359237, pinCG: 5.781 * IN, pinRG2: 13.90 * IN * IN, pinCOR: 0.670,
  pinSpacing: 12 * IN, rowSpacing: 10.392 * IN,
  kickback: 60.125 * IN, kickH: 20.5 * IN, pitDrop: 10 * IN, cushion: 25 * IN,
  ballR: 0.108, ballM: 7.2, ballRG: 2.63 * IN,
  eyeH: 1.64,
  eyeBackS: -15 * FT,
  walkVmax: 2.0, walkTau: 0.25, eyeStopS: -0.30,
};
DIM.board = DIM.laneW / 39;
DIM.headS = DIM.laneLen;
DIM.deckEnd = DIM.headS + DIM.deckPast;
DIM.deckStart = DIM.headS - 0.30;
DIM.startS = -DIM.approach;
DIM.eyeS = DIM.eyeBackS;
function boardX(n) { return DIM.laneW / 2 - (n - 0.5) * DIM.board; }
const PIN_SPOTS = (() => {
  const out = []; let n = 1;
  for (let r = 0; r < 4; r++) for (let k = 0; k <= r; k++) out.push([n++, (k - r / 2) * DIM.pinSpacing, DIM.headS + r * DIM.rowSpacing]);
  return out;
})();
const PL = { G: 9.81, A_DRIVE: 0.8899, APPROACH: 4.57, OIL: 12.20, LANE: 18.12, MU: [0.2, 0.04, 0.2], WN: 2 * Math.PI * 1.823, ZETA: 0.7, DT: 0.01,
